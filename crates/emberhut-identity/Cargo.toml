[package]
name = "emberhut-identity"
description = "An emberhut machine's identity: its Ed25519 keys, the machine id, and the statements it signs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Serialize and Deserialize for the keys, ids, signatures and normal forms, as their text.
serde = ["dep:serde"]

[dependencies]
data-encoding = { workspace = true }
ed25519-dalek = { workspace = true, features = ["fast", "zeroize"] }
form_urlencoded = { workspace = true }
getrandom = { workspace = true }
idna = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
