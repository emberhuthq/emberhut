[package]
name = "emberhut-runner"
description = "The emberhut runner: the daemon on each machine that runs coding-agent sessions for a server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "emberhut-runner"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true }
jiff = { workspace = true, features = ["std"] }
regex = { workspace = true, features = ["perf", "std", "unicode"] }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
sea-orm = { workspace = true, features = ["macros", "runtime-tokio", "sqlx-sqlite", "with-json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true }
webpki-roots = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt"] }
getrandom = { workspace = true }

# statfs for the free disk, uname for the host name, the launchd domain (`gui/<uid>`) and stopping
# a run, without unsafe code.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "system"] }

# The Windows service: the service manager's API, and the registry for the service's environment
# and for the description that marks it as the runner's own.
[target.'cfg(windows)'.dependencies]
windows-registry = { workspace = true }
windows-service = { workspace = true }

[dev-dependencies]
form_urlencoded = { workspace = true }
emberhut-api = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
