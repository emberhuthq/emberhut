[package]
name = "emberhut-relay"
description = "The emberhut relay and its account directory: one binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "emberhut-relay"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
clap = { workspace = true, features = ["derive", "env"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
log = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
sea-orm = { workspace = true, features = ["macros", "runtime-tokio", "sqlx-sqlite"] }
sea-orm-migration = { workspace = true, features = ["runtime-tokio", "sqlx-sqlite"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "tracing-log"] }
url = { workspace = true }
webpki-roots = { workspace = true }
emberhut-api = { workspace = true }
emberhut-identity = { workspace = true, features = ["serde"] }

[dev-dependencies]
base64 = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
rsa = { workspace = true, features = ["encoding", "getrandom", "std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
