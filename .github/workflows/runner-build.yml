name: Runner build

# The runner's downloads (apps/runner, ADR 0033): one per platform, each built on that platform so
# the Agent SDK's native binary matches, plus the two installers with the release's version written
# in. The release workflow calls this with the release's version and attaches what it uploads
# (artifacts runner-<target> and runner-installers); a pull request that changes the runner or its
# build runs it as a dry run, its outputs kept as the run's artifacts only.

on:
  workflow_call:
    inputs:
      version:
        description: "The release's version (X.Y.Z or X.Y.Z-rc.N, no v)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "The version to build (X.Y.Z or X.Y.Z-rc.N, no v)"
        required: true
        type: string
  pull_request:
    paths:
      - apps/runner/**
      - .github/workflows/runner-build.yml
      - .nvmrc
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: runner-build-${{ github.event_name == 'pull_request' && github.ref || inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: runner ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: windows-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # A dry run builds as the package's own version's first prerelease would.
      VERSION: ${{ inputs.version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The pnpm the root package.json pins, installed for this job only, outside setup-node's tool cache.
      - run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          if [ "$RUNNER_OS" = Windows ]; then echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"; else echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"; fi
      - run: pnpm install --frozen-lockfile --filter "@emberhut/runner..."
      - name: Build
        run: |
          version="${VERSION:-$(node -p "require('./apps/runner/package.json').version")-dev.${GITHUB_RUN_NUMBER}}"
          node --disable-warning=ExperimentalWarning apps/runner/scripts/package.ts --target "${{ matrix.target }}" --version "$version" --out "$RUNNER_TEMP/runner-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/runner-dist/emberhut-runner-*.tar.gz
            ${{ runner.temp }}/runner-dist/emberhut-runner-*.zip
            ${{ runner.temp }}/runner-dist/emberhut-runner-*.sha256
          if-no-files-found: error

  installers:
    name: runner installers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the version in
        run: |
          mkdir -p "$RUNNER_TEMP/installers"
          if [ -n "$VERSION" ]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
          fi
          sed "s/^SCRIPT_VERSION=\"\"\$/SCRIPT_VERSION=\"$VERSION\"/" apps/runner/install/install-runner.sh > "$RUNNER_TEMP/installers/install-runner.sh"
          sed "s/^\\\$ScriptVersion = \"\"\$/\$ScriptVersion = \"$VERSION\"/" apps/runner/install/install-runner.ps1 > "$RUNNER_TEMP/installers/install-runner.ps1"
          grep -q "^SCRIPT_VERSION=\"$VERSION\"" "$RUNNER_TEMP/installers/install-runner.sh"
          grep -q "^\$ScriptVersion = \"$VERSION\"" "$RUNNER_TEMP/installers/install-runner.ps1"
          sh -n "$RUNNER_TEMP/installers/install-runner.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-installers
          path: ${{ runner.temp }}/installers/
          if-no-files-found: error
