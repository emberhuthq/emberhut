name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Run the macOS legs whatever changed (otherwise they run only when the Mac build is touched)"
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel their own stale runs; every commit on main keeps its verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step.
    shell: bash

# Runners: GitHub's hosted runners, Ubuntu 24.04, macOS 15 (Apple silicon) and Windows Server 2025. The workflow uses
# no secrets and a read-only token, so pull requests from forks run it too, once a maintainer
# approves an outside contributor's first run.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Every warning fails the build: rustc, clippy, rustdoc and Cargo's own manifest warnings.
  CARGO_BUILD_WARNINGS: deny
  RUST_BACKTRACE: short
  # A test run: the desktop app keeps its secrets out of the Keychain (apps/desktop/README.md).
  EMBERHUT_TEST: "1"
  # GPUI's system libraries on Ubuntu, and ALSA's for the desktop's microphone (dictation).
  LINUX_DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev
    libxcb1-dev libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev pkg-config
    libasound2-dev

jobs:
  # Which operating systems the clippy, test and build jobs run on. macOS runners are the scarce
  # ones, so a pull request whose every changed file is outside what the Mac app, the hut's server
  # and the release pipeline build (the phone app, the site's pages, docs, the JS packages, the
  # relay) runs those jobs on Linux and Windows only. Any other file, and every push to main, a
  # tag or a manual run with `macos` set, runs all three. The list below is of paths known to stay
  # out of the Mac build; a path missing from it errs towards running macOS.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: os
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MANUAL_MACOS: ${{ inputs.macos }}
        run: |
          all='["linux","macos","windows"]'
          if [ "$EVENT" = pull_request ]; then
            git fetch --quiet --depth=1 origin "$BASE"
            from=$BASE
          elif [ "$EVENT" = workflow_dispatch ] && [ "$MANUAL_MACOS" != true ]; then
            git fetch --quiet --depth=1 origin main
            from=FETCH_HEAD
          else
            echo "os=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paths outside the Mac build: the desktop embeds site/shared's logos and the Mac helper
          # reads apps/extension/manifest.json, so those two stay in.
          mac_free='^(apps/mobile/|apps/web/|apps/extension/|site/|docs/|packages/|deploy/|patches/|crates/emberhut-relay/|\.github/dependabot\.yml$|\.gitleaks[^/]*\.toml$|(README|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\.md$|LICENSE-|package\.json$|pnpm-(lock|workspace)\.yaml$|\.nvmrc$)'
          mac_inside='^(site/shared/|apps/extension/manifest\.json$)'
          changed=$(git diff --name-only "$from" HEAD)
          printf 'changed:\n%s\n' "$changed"
          if [ -n "$changed" ] && ! grep -vE "$mac_free" <<<"$changed" | grep -q . && ! grep -qE "$mac_inside" <<<"$changed"; then
            echo "Nothing the Mac builds changed: no macOS legs."
            echo 'os=["linux","windows"]' >> "$GITHUB_OUTPUT"
          else
            echo "os=$all" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  # On macOS and Windows too: the desktop's macOS-only code (its menu keys, the computer name, the
  # automation's memory readout and its `unsafe`) is only seen by a macOS build, and the Windows
  # code paths (the hut's folders and processes, a step's files) by a Windows one.
  clippy:
    name: clippy and rustdoc (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || matrix.os == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.os == 'windows' && 60 || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          read -ra deps <<< "$LINUX_DEPS"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${deps[@]}"
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - if: runner.os != 'Windows'
        run: cargo doc --workspace --all-features --no-deps --locked
      # The Mac helper (apps/hands) is an empty library on Windows, whose crate page would link
      # to modules that aren't built there.
      - if: runner.os == 'Windows'
        run: cargo doc --workspace --exclude emberhut-hands --all-features --no-deps --locked

  test:
    name: tests (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || matrix.os == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.os == 'windows' && 60 || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          read -ra deps <<< "$LINUX_DEPS"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${deps[@]}"
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.environment == 'github-hosted' || runner.os != 'Linux'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      - run: cargo test --workspace --all-features --doc --locked
      # The hut for real on Windows (apps/desktop/src/hut/real_tests.rs): a built
      # emberhut-server.exe started by the app's code with its files in a temporary home, a
      # pairing code made and taken, and the hut stopped.
      - name: a real hut starts, pairs and stops (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p emberhut-server --locked
          $hutHome = Join-Path ([IO.Path]::GetTempPath()) "hut-home-$PID"
          New-Item -ItemType Directory -Force (Join-Path $hutHome 'local') | Out-Null
          $env:USERPROFILE = $hutHome
          $env:LOCALAPPDATA = Join-Path $hutHome 'local'
          $env:EMBERHUT_SERVER_BIN = (Resolve-Path target/debug/emberhut-server.exe).Path
          cargo nextest run -p emberhut-desktop --all-features --locked --profile ci --run-ignored only -E 'test(=hut::real_tests::a_real_hut_starts_pairs_this_app_and_stops)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Only the Windows job opens a window: the hosted Windows runners have a desktop session and
  # Direct3D 11 through the WARP software renderer, so the release build's `--self-check` draws
  # its first frame there. The hosted macOS runners are virtual machines, and GPUI draws with
  # Metal, which they aren't known to offer; a launch check there is left until that is tried.
  # The desktop's launch (and its runtime shader compile) is checked on a Mac with the
  # automation build's `--bench start`; see apps/desktop/README.md.
  build:
    name: build (${{ matrix.os }}, release)
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os == 'macos' && 'macos-15' || matrix.os == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.os == 'windows' && 60 || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          read -ra deps <<< "$LINUX_DEPS"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${deps[@]}"
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --release --locked
      - name: the server runs (Windows)
        if: runner.os == 'Windows'
        run: target/release/emberhut-server.exe --version
      # The window opens beside the displays without the focus, draws its first frame, and the
      # app exits 0 (1 after a minute). Its log is kept either way.
      - name: the app draws its first frame (Windows, --self-check)
        if: runner.os == 'Windows'
        env:
          RUST_LOG: info
        run: |
          set +e
          started=$SECONDS
          timeout 120 target/release/emberhut-desktop.exe --self-check > "$RUNNER_TEMP/self-check.log" 2>&1
          code=$?
          echo "--self-check exited $code after $((SECONDS - started)) s"
          cat "$RUNNER_TEMP/self-check.log"
          if [ "$code" -ne 0 ]; then
            echo "::error::emberhut-desktop --self-check exited $code: no first frame (its log is the self-check-log artifact)"
            exit 1
          fi
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-check-log
          path: ${{ runner.temp }}/self-check.log
          if-no-files-found: ignore
          retention-days: 14

  # The Windows installer, as a release makes it (`cargo xtask bundle-windows`, WiX Toolset v5),
  # installed per user without a prompt, its files and shortcut checked, the installed app's
  # first frame drawn, a newer version installed over it (one copy registered after), and
  # uninstalled. The MSIs and the installer's logs are kept as an artifact.
  msi:
    name: windows installer (dry run)
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # The installer's UpgradeCode (apps/desktop/wix/Emberhut.wxs).
      UPGRADE_CODE: "{DDD826CF-51BB-471D-94A5-FA14619F2764}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # v5, under the MS-RL (v6's terms add a maintenance fee).
      - name: WiX Toolset 5.0.2
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
      - name: build two installers, the second a newer version of the first
        run: |
          mkdir -p "$RUNNER_TEMP/msi"
          EMBERHUT_MSI_VERSION=0.1.1 cargo xtask bundle-windows
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "emberhut-desktop") | .version')
          mv "target/bundle/Emberhut-$version-windows-x64.msi" "$RUNNER_TEMP/msi/first.msi"
          EMBERHUT_MSI_VERSION=0.1.2 cargo xtask bundle-windows
          mv "target/bundle/Emberhut-$version-windows-x64.msi" "$RUNNER_TEMP/msi/second.msi"
          ls -l "$RUNNER_TEMP/msi"
      - name: install, check, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'msi'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Emberhut'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Emberhut.lnk'
          function Invoke-Msi([string[]] $arguments) {
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "msiexec $arguments exited $($process.ExitCode)" }
          }
          function Get-Installed {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            @($installer.RelatedProducts($env:UPGRADE_CODE)) | ForEach-Object {
              [pscustomobject]@{ Code = $_; Version = $installer.ProductInfo($_, 'VersionString') }
            }
          }

          Invoke-Msi @('/i', "$msi\first.msi", '/qn', '/l*v', "$msi\install.log")
          foreach ($file in 'emberhut-desktop.exe', 'emberhut-server.exe', 'LICENSE-MIT.txt', 'LICENSE-APACHE.txt', 'README.md') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "$file is not in $dir" }
          }
          if (-not (Test-Path $shortcut)) { throw "no Start menu shortcut at $shortcut" }
          $installed = @(Get-Installed)
          if ($installed.Count -ne 1 -or $installed[0].Version -ne '0.1.1') { throw "installed: $($installed | Out-String)" }
          & (Join-Path $dir 'emberhut-server.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "the installed server's --version exited $LASTEXITCODE" }

          # The installed app draws its first frame.
          $check = Start-Process (Join-Path $dir 'emberhut-desktop.exe') -ArgumentList '--self-check' -Wait -PassThru `
            -RedirectStandardError "$msi\self-check.log" -RedirectStandardOutput "$msi\self-check.out"
          Get-Content "$msi\self-check.log"
          if ($check.ExitCode -ne 0) { throw "the installed app's --self-check exited $($check.ExitCode)" }

          # A silent per-user upgrade, as the updater runs it: one copy registered after.
          Invoke-Msi @('/i', "$msi\second.msi", '/passive', '/norestart', '/l*v', "$msi\upgrade.log")
          $installed = @(Get-Installed)
          if ($installed.Count -ne 1 -or $installed[0].Version -ne '0.1.2') { throw "after the upgrade: $($installed | Out-String)" }
          if (-not (Test-Path (Join-Path $dir 'emberhut-desktop.exe'))) { throw 'the app is gone after the upgrade' }

          Invoke-Msi @('/x', "$msi\second.msi", '/qn', '/l*v', "$msi\uninstall.log")
          if (@(Get-Installed).Count -ne 0) { throw 'still registered after the uninstall' }
          if (Test-Path $dir) { throw "$dir is still there after the uninstall" }
          if (Test-Path $shortcut) { throw 'the shortcut is still there after the uninstall' }
          Write-Output 'installed, checked, upgraded and uninstalled'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: ${{ runner.temp }}/msi
          if-no-files-found: ignore
          retention-days: 14

  coverage:
    name: coverage (libraries)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.environment == 'github-hosted' || runner.os != 'Linux'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2,cargo-nextest@0.9.152
      # Every library crate; the binaries (the desktop app, xtask) are excluded.
      - run: cargo llvm-cov nextest --workspace --exclude emberhut-desktop --exclude xtask --all-features --locked --summary-only --color never > coverage.txt
      - run: |
          cat coverage.txt
          {
            echo '### Coverage (libraries)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted' || runner.os != 'Linux'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1
      - run: cargo deny --locked check advisories bans licenses sources

  machete:
    name: cargo machete
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.environment == 'github-hosted' || runner.os != 'Linux'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-machete@0.10.1
      - run: cargo machete

  secrets:
    name: secret and personal-data scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      # Only the history of the commit under test: with fetch-depth 0 the checkout also holds
      # every other branch, and their findings belong to their own pull requests.
      - run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --log-opts="HEAD" .
      # The wording rules (CONTRIBUTING.md, "Writing for a public repository") apply to the files
      # of the commit under test.
      - run: |
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks-public.toml --redact --verbose .
      - name: no .env, key or generated files tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)|\.(pem|p12|key)$'; then
            echo "::error::a .env or key file is tracked"; exit 1
          fi
          # The directory scan skips these generated paths (.gitleaks-public.toml), so none may be
          # tracked. The mobile app's config plugins live in apps/mobile/plugins, outside them.
          if git ls-files | grep -E '(^|/)(target|node_modules|dist|\.expo)/|^apps/mobile/(ios|android)/|\.(tsbuildinfo|profraw)$|(^|/)lcov\.info$'; then
            echo "::error::a generated file is tracked"; exit 1
          fi

  # The pnpm workspace (ADR 0003's js job): every package's check script (types, lint, format, tests) from the
  # workspace's lockfile; today that is apps/mobile and apps/extension (whose check also builds it and writes its zip),
  # and the api-client generation step joins it with packages/api-client. The mobile app's native builds (Xcode,
  # Gradle) are made on a maintainer's machine; see apps/mobile/README.md.
  js:
    name: js (tsc, lint, format, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The pnpm the root package.json pins, installed for this job only, outside setup-node's tool cache.
      - run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run check
      # A build without the emberhut.com account carries none of Clerk (apps/mobile/README.md, "The emberhut.com account"):
      # the app picks Clerk's modules on the literal EXPO_PUBLIC_ settings, which Metro inlines, so the Android bundle
      # made with them unset must hold neither Clerk's provider nor any of its packages.
      - name: mobile bundle without the account has no Clerk
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_EMBERHUT_CLERK_PUBLISHABLE_KEY: ""
          EXPO_PUBLIC_EMBERHUT_DIRECTORY_URL: ""
          EXPO_PUBLIC_EMBERHUT_PASSKEYS: ""
        run: |
          pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/mobile-bundle"
          if grep -a -r -l -e ClerkProvider -e '@clerk/' "$RUNNER_TEMP/mobile-bundle"; then
            echo "::error::Clerk is in the bundle of a build without the account"; exit 1
          fi

  # The one check to require: green only when every job above is.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, fmt, clippy, test, build, msi, coverage, deny, machete, secrets, js]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::a required job did not succeed"; exit 1
          fi
