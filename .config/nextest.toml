[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

# CI prints each failure as it happens and again at the end.
[profile.ci]
failure-output = "immediate-final"

# The document's coverage check runs every route test once more in its own process (several at
# a time) to see that each documented status is got, so it takes longer than any one test.
[[profile.default.overrides]]
filter = "test(=openapi::every_documented_status_is_exercised)"
slow-timeout = { period = "60s", terminate-after = 4 }
