allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
# Product names that are not code: ".." keeps clippy's own list.
doc-valid-idents = ["WhatsApp", "iMessage", ".."]

# The API describes itself: every route goes through utoipa-axum's router, so the OpenAPI
# document cannot miss one (ADR 0002). Only emberhut-server depends on utoipa-axum; the Mac helper
# (apps/hands) serves a private API with axum and says so where it registers its routes.
[[disallowed-methods]]
path = "axum::Router::route"
reason = "add routes with utoipa-axum's OpenApiRouter and routes!, so the document lists them"

[[disallowed-methods]]
path = "axum::Router::route_service"
reason = "add routes with utoipa-axum's OpenApiRouter and routes!, so the document lists them"

[[disallowed-methods]]
path = "utoipa_axum::router::OpenApiRouter::route"
reason = "use OpenApiRouter::routes with routes!, which puts the route in the document"

[[disallowed-methods]]
path = "utoipa_axum::router::OpenApiRouter::route_service"
reason = "use OpenApiRouter::routes with routes!, which puts the route in the document"

# The desktop app opens every window through shell::unseen::open_window, and comes forward or
# goes full screen only through its activate_app, bring_forward and toggle_fullscreen, so a run
# no one watches (an unseen run) never shows a window or takes the keyboard from the person at
# the computer.
[[disallowed-methods]]
path = "gpui_kit::open_window"
reason = "open windows with shell::unseen::open_window, which keeps an unseen run's out of sight"

[[disallowed-methods]]
path = "gpui::App::open_window"
reason = "open windows with shell::unseen::open_window, which keeps an unseen run's out of sight"

[[disallowed-methods]]
path = "gpui::AsyncApp::open_window"
reason = "open windows with shell::unseen::open_window, which keeps an unseen run's out of sight"

[[disallowed-methods]]
path = "gpui::App::activate"
reason = "use shell::unseen::activate_app, which leaves an unseen run behind the app in use"

[[disallowed-methods]]
path = "gpui::Window::activate_window"
reason = "use shell::unseen::bring_forward, which leaves an unseen run's windows where they are"

[[disallowed-methods]]
path = "gpui::Window::toggle_fullscreen"
reason = "use shell::unseen::toggle_fullscreen: full screen would put an unseen run's window on a display"

[[disallowed-methods]]
path = "gpui::Window::request_attention"
reason = "an unseen run asks for no one's attention; add a helper in shell::unseen that skips it there"
